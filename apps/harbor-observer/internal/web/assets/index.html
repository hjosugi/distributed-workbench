<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harbor Observer</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Distributed Workbench</p>
        <h1>Harbor Observer</h1>
        <p class="lead">複数Harbor serverへ同じpathを送り、到達性・latency・SHA-256を比較します。</p>
      </div>
      <div id="overall" class="badge neutral">未実行</div>
    </header>

    <section class="panel controls">
      <label for="path">Probe path</label>
      <div class="row">
        <input id="path" value="/status" spellcheck="false" />
        <button id="run">Probe</button>
      </div>
      <div class="quick">
        <button data-path="/status" class="secondary">/status</button>
        <button data-path="/" class="secondary">/</button>
      </div>
      <p class="hint">blobを比較するときは <code>/blob/1_&lt;sha256 hex&gt;</code> を指定します。</p>
    </section>

    <section class="stats" id="stats"></section>

    <section class="panel">
      <div class="section-title">
        <h2>Server results</h2>
        <span id="timestamp"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Server</th><th>Status</th><th>Latency</th><th>Bytes</th><th>SHA-256</th><th>Preview / Error</th>
            </tr>
          </thead>
          <tbody id="results"><tr><td colspan="6" class="empty">Probeを実行してください。</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="section-title"><h2>Recent probes</h2><button id="refresh" class="secondary">Refresh</button></div>
      <div id="history" class="history"></div>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
