name: software-architect-roadmap
services:
  orders:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      CATALOG_URL: http://catalog:8081
    volumes: ["orders-data:/data"]
    depends_on: [catalog]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  catalog:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "catalog.mjs"]
    environment:
      BIND_HOST: 0.0.0.0
      PORT: "8081"
    volumes: ["./examples/catalog/javascript:/app:ro"]
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8088:8088"]
    volumes: ["./infra/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [orders, catalog]
  redis:
    profiles: [data]
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
  kafka:
    profiles: [data]
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
volumes:
  orders-data:
  redis-data:
