name: realtime-prompter
on:
  push:
    paths:
      - apps/realtime-prompter/**
      - .github/workflows/realtime-prompter.yml
  pull_request:
    paths:
      - apps/realtime-prompter/**
      - .github/workflows/realtime-prompter.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/realtime-prompter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
