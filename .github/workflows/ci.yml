name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - run: go test ./apps/harbor-observer/... ./apps/nsq-reliable-worker/...

  pgplay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pgplay-recipes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
